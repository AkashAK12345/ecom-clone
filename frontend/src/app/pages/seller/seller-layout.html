<div class="seller-layout">
  <nav class="seller-subnav" aria-label="Seller sections">
    <div class="subnav-container">
      <a
        routerLink="/seller"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active"
        class="subnav-item"
      >
        <svg class="subnav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="9"></rect>
          <rect x="14" y="3" width="7" height="5"></rect>
          <rect x="14" y="12" width="7" height="9"></rect>
          <rect x="3" y="16" width="7" height="5"></rect>
        </svg>
        <span class="subnav-label">Dashboard</span>
      </a>

      <a
        routerLink="/seller/add-product"
        routerLinkActive="active"
        class="subnav-item"
      >
        <svg class="subnav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <line x1="12" y1="9" x2="12" y2="15"></line>
          <line x1="9" y1="12" x2="15" y2="12"></line>
        </svg>
        <span class="subnav-label">Add Product</span>
      </a>

      <a
        routerLink="/seller/products"
        routerLinkActive="active"
        class="subnav-item"
      >
        <svg class="subnav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="subnav-label">My Products</span>
      </a>

      <a
        routerLink="/seller/orders"
        routerLinkActive="active"
        class="subnav-item"
      >
        <svg class="subnav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          <path d="M9 12h6M9 16h6"></path>
        </svg>
        <span class="subnav-label">Orders for My Products</span>
      </a>
    </div>
  </nav>

  <main class="seller-main-content">
    <router-outlet />
  </main>
</div>
